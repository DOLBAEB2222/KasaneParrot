name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish error report
        if: failure() && github.event_name == 'push'
        run: |
          mkdir -p ci-logs
          {
            echo "commit: $GITHUB_SHA"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            grep -nE -A6 "error:" build.log | head -400 || true
            echo
            echo "===== tail -120 ====="
            tail -120 build.log
          } > ci-logs/last-build.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-logs
          git commit -m "ci: отчёт сборки [ci skip]" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Cleanup old report
        if: success() && github.event_name == 'push'
        run: |
          if [ -d ci-logs ]; then
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git rm -r --cached ci-logs || true
            rm -rf ci-logs
            git commit -m "ci: очистка отчёта [ci skip]" || echo "nothing to commit"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "no logs to clean"
          fi

      - name: Publish dev release
        if: success() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls build/libs/
          NOTES=$(cat <<'EOF'
          Автосборка KasaneParrot (Paper 1.21.8, Java 21).

          **Быстрый тест**
          1. Положите jar в `plugins/`, запустите сервер.
          2. Приручите попугая семечками (пшеница/тыква/дыня/свёкла).
          3. Shift+ПКМ мешочком (Bundle) по своему попугаю — он станет курьером.
          4. ПКМ по попугаю с предметом в руке (или Shift+ПКМ) — меню отправки.
          5. Чтобы не ждать 30 сек–5 мин, в `plugins/KasaneParrot/config.yml`
             поставьте `delivery.time.min-seconds: 5`, `max-seconds: 15` и
             выполните `/kasane reload`.

          Ресурспак «Pesky Parrots.zip» — в корне репозитория (по желанию;
          смена «модельки» работает и без него — меняется вариант попугая).
          EOF
          )
          gh release delete dev --yes --cleanup-tag || true
          JAR=$(find build/libs -name "*.jar" ! -name "*-sources.jar" | head -1)
          echo "Публикую: $JAR"
          gh release create dev \
            --target "$GITHUB_SHA" \
            --title "KasaneParrot — dev-сборка" \
            --notes "$NOTES" \
            --prerelease \
            "$JAR"

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KasaneParrot-jar
          path: build/libs/*.jar
          if-no-files-found: warn
