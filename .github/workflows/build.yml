name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish error report
        if: failure()
        run: |
          mkdir -p ci-logs
          {
            echo "commit: $GITHUB_SHA"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            grep -nE "error:|warning:|FAILED|Exception|\.java:" build.log | head -150 || true
            echo
            echo "===== tail -120 ====="
            tail -120 build.log
          } > "ci-logs/last-build.log"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci-logs
          git commit -m "ci: отчёт сборки [ci skip]" || echo "nothing to commit"
          git push

      - name: Cleanup old report
        if: success()
        run: |
          if [ -d ci-logs ]; then
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git rm -r --cached ci-logs || true
            rm -rf ci-logs
            git commit -m "ci: очистка отчёта [ci skip]" || echo "nothing to commit"
            git push
          else
            echo "no logs to clean"
          fi

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KasaneParrot-jar
          path: build/libs/*.jar
          if-no-files-found: warn
